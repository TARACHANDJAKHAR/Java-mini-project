<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Dashboard - UMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }</style>
</head>
<body class="text-gray-800">

    <nav class="bg-indigo-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold">Student Portal</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userName" class="text-sm font-medium">Loading...</span>
                <button onclick="logout()" class="bg-indigo-800 px-4 py-2 rounded text-sm hover:bg-indigo-900 transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <!-- Profile Card -->
        <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex items-center space-x-6">
            <div class="bg-indigo-100 p-4 rounded-full">
                <svg class="w-12 h-12 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </div>
            <div>
                <h2 id="profileName" class="text-2xl font-bold text-gray-900">Loading...</h2>
                <p id="profileDept" class="text-gray-500">Department</p>
                <p id="profileEmail" class="text-sm text-gray-400">email@example.com</p>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Registered Courses -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-semibold text-gray-800">My Registered Courses</h2>
                </div>
                <div class="overflow-x-auto max-h-96">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Course ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Course Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Credits</th>
                            </tr>
                        </thead>
                        <tbody id="registeredBody" class="bg-white divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Available Courses -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-semibold text-gray-800">Available Courses</h2>
                </div>
                <div class="overflow-x-auto max-h-96">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Course ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Course Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Action</th>
                            </tr>
                        </thead>
                        <tbody id="availableBody" class="bg-white divide-y divide-gray-200">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role != 2) window.location.href = '/';
        document.getElementById('userName').innerText = "Student: " + user.username;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        async function loadData() {
            try {
                // Load Profile
                const profRes = await fetch(`/api/student/${user.username}/profile`);
                const profile = await profRes.json();
                if(profile.Name) {
                    document.getElementById('profileName').innerText = profile.Name;
                    document.getElementById('profileDept').innerText = profile.Department + " | Semester " + profile.Semester;
                    document.getElementById('profileEmail').innerText = profile.Email;
                }

                // Load Registered
                const regRes = await fetch(`/api/student/${user.username}/registered-courses`);
                const registered = await regRes.json();
                let regHtml = '';
                registered.forEach(c => {
                    regHtml += `<tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${c.CourseID}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.CourseName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.Credits}</td>
                    </tr>`;
                });
                document.getElementById('registeredBody').innerHTML = regHtml;

                // Load Available
                const availRes = await fetch(`/api/student/${user.username}/courses`);
                const available = await availRes.json();
                let availHtml = '';
                available.forEach(c => {
                    // check if already registered
                    if(!registered.find(r => r.CourseID === c.CourseID)) {
                        availHtml += `<tr class="hover:bg-gray-50">
                            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${c.CourseID}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.CourseName}</td>
                            <td class="px-6 py-4 whitespace-nowrap text-sm text-center">
                                <button onclick="registerCourse('${c.CourseID}')" class="text-indigo-600 hover:text-indigo-900 bg-indigo-50 px-3 py-1 rounded">Register</button>
                            </td>
                        </tr>`;
                    }
                });
                document.getElementById('availableBody').innerHTML = availHtml;

            } catch (err) {
                console.error("Failed to load dashboard data", err);
            }
        }

        async function registerCourse(courseId) {
            await fetch('/api/student/register-course', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ StudentID: user.username, CourseID: courseId })
            });
            loadData();
        }

        loadData();
    </script>
</body>
</html>
