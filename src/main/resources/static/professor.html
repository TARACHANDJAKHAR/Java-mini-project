<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professor Dashboard - UMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }</style>
</head>
<body class="text-gray-800">

    <nav class="bg-emerald-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold">Professor Portal</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userName" class="text-sm font-medium">Loading...</span>
                <button onclick="logout()" class="bg-emerald-800 px-4 py-2 rounded text-sm hover:bg-emerald-900 transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                <h2 class="text-lg font-semibold text-gray-800">My Assigned Courses</h2>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Course ID</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Course Name</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Credits</th>
                            <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Syllabus</th>
                        </tr>
                    </thead>
                    <tbody id="courseBody" class="bg-white divide-y divide-gray-200">
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role != 3) window.location.href = '/';
        document.getElementById('userName').innerText = "Professor ID: " + user.username;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        async function loadData() {
            try {
                const res = await fetch(`/api/professor/${user.username}/courses`);
                const courses = await res.json();
                let html = '';
                courses.forEach(c => {
                    html += `<tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${c.CourseID}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.CourseName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.Credits}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.syllabus || 'N/A'}</td>
                    </tr>`;
                });
                document.getElementById('courseBody').innerHTML = html;
            } catch (err) {
                console.error("Failed to load dashboard data", err);
            }
        }

        loadData();
    </script>
</body>
</html>
