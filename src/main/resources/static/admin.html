<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - UMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>body { font-family: 'Inter', sans-serif; background-color: #f9fafb; }</style>
</head>
<body class="text-gray-800">

    <nav class="bg-blue-700 text-white shadow-lg">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <div class="flex items-center space-x-3">
                <span class="text-xl font-bold">Admin Portal</span>
            </div>
            <div class="flex items-center space-x-4">
                <span id="userName" class="text-sm font-medium">Loading...</span>
                <button onclick="logout()" class="bg-blue-800 px-4 py-2 rounded text-sm hover:bg-blue-900 transition">Logout</button>
            </div>
        </div>
    </nav>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 space-y-8">
        <!-- Stats Row -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center items-center">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Total Students</h3>
                <p id="studentCount" class="text-4xl font-bold text-blue-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center items-center">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Total Courses</h3>
                <p id="courseCount" class="text-4xl font-bold text-green-600">0</p>
            </div>
            <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col justify-center items-center">
                <h3 class="text-gray-500 text-sm font-semibold uppercase tracking-wider mb-2">Pending Inquiries</h3>
                <p id="inquiryCount" class="text-4xl font-bold text-orange-600">0</p>
            </div>
        </div>

        <!-- Content Split -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
            <!-- Students Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-semibold text-gray-800">Students Directory</h2>
                </div>
                <div class="overflow-x-auto max-h-96">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dept</th>
                            </tr>
                        </thead>
                        <tbody id="studentTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Courses Table -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50">
                    <h2 class="text-lg font-semibold text-gray-800">Courses Catalog</h2>
                </div>
                <div class="overflow-x-auto max-h-96">
                    <table class="min-w-full divide-y divide-gray-200">
                        <thead class="bg-gray-50 sticky top-0">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Course Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Credits</th>
                            </tr>
                        </thead>
                        <tbody id="courseTableBody" class="bg-white divide-y divide-gray-200">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <script>
        const user = JSON.parse(localStorage.getItem('user'));
        if (!user || user.role != 1) {
            window.location.href = '/';
        }
        document.getElementById('userName').innerText = "Admin: " + user.username;

        function logout() {
            localStorage.removeItem('user');
            window.location.href = '/';
        }

        async function loadData() {
            try {
                const stdRes = await fetch('/api/admin/students');
                const students = await stdRes.json();
                document.getElementById('studentCount').innerText = students.length;
                let stdHtml = '';
                students.forEach(s => {
                    stdHtml += `<tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${s.StudentID}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.Name}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${s.Department}</td>
                    </tr>`;
                });
                document.getElementById('studentTableBody').innerHTML = stdHtml;

                const crsRes = await fetch('/api/admin/courses');
                const courses = await crsRes.json();
                document.getElementById('courseCount').innerText = courses.length;
                let crsHtml = '';
                courses.forEach(c => {
                    crsHtml += `<tr class="hover:bg-gray-50">
                        <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">${c.CourseID}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.CourseName}</td>
                        <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${c.Credits}</td>
                    </tr>`;
                });
                document.getElementById('courseTableBody').innerHTML = crsHtml;
                
                const inqRes = await fetch('/api/admin/inquiries');
                const inquiries = await inqRes.json();
                document.getElementById('inquiryCount').innerText = inquiries.length;
            } catch (err) {
                console.error("Failed to load dashboard data", err);
            }
        }

        loadData();
    </script>
</body>
</html>
